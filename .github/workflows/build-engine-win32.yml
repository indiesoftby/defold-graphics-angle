# Keep this in sync with
# https://github.com/defold/defold/blob/dev/.github/workflows/engine-nightly.yml

name: Build Defold Win32

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_BRANCH: ${{ vars.BUILD_BRANCH }}
  RELEASE_TAG: ${{ vars.RELEASE_TAG }}

jobs:
  bld-eng-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-win32
            artifact_platform: x86_64-win32
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout Defold
        uses: actions/checkout@v5
        with:
          repository: defold/defold
          ref: ${{env.BUILD_BRANCH}}

      - name: Checkout the patch
        uses: actions/checkout@v5
        with:
          path: patch

      - name: Apply code patch
        shell: bash
        run: |
          git apply patch/angle.patch

      - name: Copy ANGLE to packages
        shell: bash
        run: |
          cp patch/angle-06e6c6b5-x86_64-win32.tar.gz packages/

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12

      - name: Install Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: '25'
          distribution: temurin

      - name: Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Build
        id: build
        shell: bash
        run: |
          # Use the runner's Visual Studio and Windows SDK. ci.sh engine downloads packaged SDKs.
          build_original_path="$PATH"
          python scripts/build.py save_env --save-env-path=ci/env.sh
          source ci/env.sh
          export PATH="$PATH:$build_original_path"
          python -u scripts/build.py install_ext build_engine \
            --platform=${{ matrix.platform }} --disable-ccache \
            --skip-builtins --skip-tests --skip-docs -- --skip-build-tests 2>&1 | tee build.log

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: python
        run: |
          from pathlib import Path
          log = Path("build.log")
          if log.exists():
              tail = "\n".join(log.read_text(encoding="utf-8", errors="replace").splitlines()[-80:])
              tail = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Windows engine build failed::{tail}")

      - name: Upload build log
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: defold-${{ matrix.platform }}
          path: |
            tmp/dynamo_home/bin/${{ matrix.artifact_platform }}
            tmp/dynamo_home/lib/${{ matrix.artifact_platform }}

  package-extension:
    needs: bld-eng-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v5

      - name: Download artifact x86_64-win32
        uses: actions/download-artifact@v7
        with:
          name: defold-x86_64-win32
          path: artifacts/defold-x86_64-win32

      - name: Extract ANGLE libs into extension
        run: |
          mkdir -p extension/graphics_angle/lib
          tar -xzf angle-06e6c6b5-x86_64-win32.tar.gz -C extension/graphics_angle ./lib

      - name: Copy DLLs to res folders
        shell: bash
        run: |
          mkdir -p extension/graphics_angle/res/x86_64-win32
          cp extension/graphics_angle/lib/x86_64-win32/*.dll extension/graphics_angle/res/x86_64-win32/

      - name: Prepare extension lib folders and copy graphics_opengles.lib
        run: |
          cp artifacts/defold-x86_64-win32/lib/x86_64-win32/graphics_opengles.lib extension/graphics_angle/lib/x86_64-win32/

      - name: Zip extension folder
        shell: bash
        run: |
          zip -r "graphics_angle-defold-${{ env.BUILD_BRANCH }}.zip" "extension"

      - name: Upload extension archive
        uses: actions/upload-artifact@v6
        with:
          name: graphics-angle-extension
          path: graphics_angle-defold-${{ env.BUILD_BRANCH }}.zip
          if-no-files-found: error

      - name: Release extension archive
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: graphics_angle-defold-${{ env.BUILD_BRANCH }}.zip
